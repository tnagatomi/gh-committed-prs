name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      - name: Run ShellCheck
        run: shellcheck gh-committed-prs
      - name: Run Bats tests
        run: bats tests
